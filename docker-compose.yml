services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-boutinly}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev-password-change-in-production}
      POSTGRES_DB: ${DB_NAME:-boutinly_crm}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-boutinly} -d ${DB_NAME:-boutinly_crm}"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.5"

  api:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      APP_URL: "${APP_URL:-http://localhost:3000}"
      API_URL: "${API_URL:-http://localhost:8080}"
      JWT_SECRET: "${JWT_SECRET}"
      PASSWORD_PEPPER: "${PASSWORD_PEPPER}"
      DATABASE_URL: "postgres://${DB_USER:-boutinly}:${DB_PASSWORD:-dev-password-change-in-production}@db:5432/${DB_NAME:-boutinly_crm}"
      DATABASE_SSL: "${DATABASE_SSL:-false}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:3000}"
      DEMO_LOGIN_ENABLED: "${DEMO_LOGIN_ENABLED:-false}"
      EMAIL_PROVIDER: "${EMAIL_PROVIDER:-console}"
      EMAIL_FROM: "${EMAIL_FROM:-noreply@boutinly.com}"
      EMAIL_FROM_NAME: "${EMAIL_FROM_NAME:-Boutinly CRM}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.5"

volumes:
  pgdata:
